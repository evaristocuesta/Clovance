name: Build and Test API

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

# Least privilege for the default token: this workflow only needs to read the code it
# builds and tests.
permissions:
  contents: read

jobs:
  build-api:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./api/src/Clovance.ApiService
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/src/Clovance.ApiService

    - name: Restore unit tests dependencies
      run: dotnet restore
      working-directory: ./api/tests/Clovance.UnitTests

    - name: Build unit tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/tests/Clovance.UnitTests      
    
    - name: Run unit tests
      run: dotnet test --no-build --verbosity normal --configuration Release
      working-directory: ./api/tests/Clovance.UnitTests

    - name: Restore integration tests dependencies
      run: dotnet restore
      working-directory: ./api/tests/Clovance.IntegrationTests

    - name: Build integration tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/tests/Clovance.IntegrationTests

    - name: Run integration tests
      run: dotnet test --no-build --verbosity normal --configuration Release
      working-directory: ./api/tests/Clovance.IntegrationTests      
