name: Build and Test API

on:
  push:
    branches: [ "main" ]
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "api/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

jobs:
  build-api:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./api/src/Clovance.ApiService
      
    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/src/Clovance.ApiService

    - name: Restore unit tests dependencies
      run: dotnet restore
      working-directory: ./api/tests/Clovance.UnitTests

    - name: Build unit tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/tests/Clovance.UnitTests      
    
    - name: Run unit tests
      run: dotnet test --no-build --verbosity normal --configuration Release
      working-directory: ./api/tests/Clovance.UnitTests

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.8.0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Restore integration tests dependencies
      run: dotnet restore
      working-directory: ./api/tests/Clovance.IntegrationTests

    - name: Build integration tests
      run: dotnet build --no-restore --configuration Release
      working-directory: ./api/tests/Clovance.IntegrationTests

    - name: Run integration tests
      run: dotnet test --no-build --verbosity normal --configuration Release
      working-directory: ./api/tests/Clovance.IntegrationTests
