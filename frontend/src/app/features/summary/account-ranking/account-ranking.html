<div class="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800" *transloco="let t">
	<div class="mb-3 flex items-center justify-between">
		<h3 class="text-sm font-semibold text-gray-800 dark:text-white">{{ t('summary.charts.rankingTitle') }}</h3>
		<div class="inline-flex rounded-lg border border-gray-300 p-1 dark:border-gray-600" role="group">
			<button
				type="button"
				(click)="setMetric('balance')"
				class="rounded-md px-3 py-1 text-xs font-medium cursor-pointer"
				[class.bg-primary-700]="metric() === 'balance'"
				[class.text-white]="metric() === 'balance'"
				[class.text-gray-600]="metric() !== 'balance'"
				[class.dark:text-gray-300]="metric() !== 'balance'">
				{{ t('summary.charts.rankingByBalance') }}
			</button>
			<button
				type="button"
				(click)="setMetric('cashflow')"
				class="rounded-md px-3 py-1 text-xs font-medium cursor-pointer"
				[class.bg-primary-700]="metric() === 'cashflow'"
				[class.text-white]="metric() === 'cashflow'"
				[class.text-gray-600]="metric() !== 'cashflow'"
				[class.dark:text-gray-300]="metric() !== 'cashflow'">
				{{ t('summary.charts.rankingByCashflow') }}
			</button>
		</div>
	</div>
	<div class="h-72 w-full">
		<app-echart [options]="options()"></app-echart>
	</div>
</div>
