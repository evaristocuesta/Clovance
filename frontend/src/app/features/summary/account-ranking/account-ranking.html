<div class="rounded-2xl border border-gray-200 bg-white p-2 sm:p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800" *transloco="let t">
	<div class="mb-3 flex items-center justify-between">
		<h3 class="text-sm font-semibold text-gray-800 dark:text-white">{{ t(liabilityMode() ? 'summary.liabilities.debtRankingTitle' : 'summary.charts.rankingTitle') }}</h3>
		<div class="inline-flex rounded-lg border border-gray-300 p-0.5 dark:border-gray-600" role="group">
			<button
				type="button"
				(click)="setMetric('balance')"
				class="rounded-lg px-3 py-1 text-xs font-medium cursor-pointer"
				[class.bg-primary-700]="metric() === 'balance'"
				[class.text-white]="metric() === 'balance'"
				[class.text-gray-600]="metric() !== 'balance'"
				[class.dark:text-gray-300]="metric() !== 'balance'">
				{{ t(liabilityMode() ? 'summary.liabilities.rankingByDebt' : 'summary.charts.rankingByBalance') }}
			</button>
			<button
				type="button"
				(click)="setMetric('income')"
				class="rounded-lg px-3 py-1 text-xs font-medium cursor-pointer"
				[class.bg-primary-700]="metric() === 'income'"
				[class.text-white]="metric() === 'income'"
				[class.text-gray-600]="metric() !== 'income'"
				[class.dark:text-gray-300]="metric() !== 'income'">
				{{ t(liabilityMode() ? 'summary.liabilities.rankingByPrincipalPaid' : 'summary.charts.rankingByIncome') }}
			</button>
			<button
				type="button"
				(click)="setMetric('expenses')"
				class="rounded-lg px-3 py-1 text-xs font-medium cursor-pointer"
				[class.bg-primary-700]="metric() === 'expenses'"
				[class.text-white]="metric() === 'expenses'"
				[class.text-gray-600]="metric() !== 'expenses'"
				[class.dark:text-gray-300]="metric() !== 'expenses'">
				{{ t(liabilityMode() ? 'summary.liabilities.rankingByNewDebt' : 'summary.charts.rankingByExpenses') }}
			</button>
		</div>
	</div>
	<div class="h-72 w-full">
		<app-echart [options]="options()"></app-echart>
	</div>
</div>
