<app-dialog [title]="t('users.invitationSent')" *transloco="let t">
    <div dialog-body class="space-y-4 md:space-y-6" novalidate>
        <div class="grid gap-4 mb-4">
            <div>
                <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{
                    t('users.email') }}</label>
                <input value="{{ data.email }}" type="email" id="email" disabled
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
            </div>
            <div>
                <label for="token" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{
                    t('users.token') }}</label>
                <input value="{{ data.token }}" id="token" disabled
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
            </div>
            <div>
                <label for="expiresAt" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">{{
                    t('users.expiresAt') }}</label>
                <input value="{{ data.expiresAt | date:'dd/MM/yyyy HH:mm' }}" id="expiresAt" disabled
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
            </div>
        </div>
    </div>
    <div dialog-footer>
        <button
            class="text-white inline-flex items-center cursor-pointer bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800"
            (click)="close()">
            {{ t('users.close') }}
        </button>
    </div>
</app-dialog>
