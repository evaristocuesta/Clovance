<div role="dialog" aria-modal="true" [attr.aria-labelledby]="'dialog-title'"
  class="flex h-auto max-h-[calc(100vh-2rem)] w-[calc(100vw-2rem)] max-w-2xl flex-col overflow-hidden rounded-lg bg-white shadow-xl dark:bg-gray-800">
  <header class="flex shrink-0 items-center justify-between border-b p-5 dark:border-gray-600">
    <h2 id="dialog-title" class="text-lg font-semibold text-gray-900 dark:text-white">
      {{ title() }}
    </h2>
    <button type="button" (click)="close()" [attr.aria-label]="closeLabel()"
      class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-lg text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white">
      <app-icon name="close" class="h-5 w-5" />
    </button>
  </header>

  <main class="min-h-0 flex-1 overflow-y-auto p-5">
    <ng-content select="[dialog-body]" />
  </main>

  <footer class="flex shrink-0 justify-end gap-4 border-t bg-white p-5 dark:border-gray-600 dark:bg-gray-800">
    <ng-content select="[dialog-footer]" />
  </footer>
</div>
